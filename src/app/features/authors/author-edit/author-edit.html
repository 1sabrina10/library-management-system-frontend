<div class="author-form-page">

  <div class="author-form-card">


<div class="form-header">

  <div class="form-icon">

    <span class="material-symbols-outlined">
      edit
    </span>

  </div>

  <span class="form-eyebrow">
    BIBLIOTHÈQUE
  </span>

  <h1>
    Modifier l'auteur
  </h1>

  <p>
    Modifiez les informations de cet auteur.
  </p>

</div>


<form (ngSubmit)="modifierAuteur()">

  <div class="form-group">

    <label for="firstname">
      Prénom
    </label>

    <div class="input-wrapper">

      <span class="material-symbols-outlined">
        person
      </span>

      <input
        id="firstname"
        type="text"
        [(ngModel)]="firstname"
        name="firstname"
        placeholder="Prénom de l'auteur"
        required
      >

    </div>

  </div>

  <div class="form-group">

    <label for="lastname">
      Nom
    </label>

    <div class="input-wrapper">

      <span class="material-symbols-outlined">
        badge
      </span>

      <input
        id="lastname"
        type="text"
        [(ngModel)]="lastname"
        name="lastname"
        placeholder="Nom de l'auteur"
        required
      >

    </div>

  </div>

  <div class="form-group">

    <label for="biography">
      Biographie
    </label>

    <div class="input-wrapper textarea-wrapper">

      <span class="material-symbols-outlined">
        description
      </span>

      <textarea
        id="biography"
        [(ngModel)]="biography"
        name="biography"
        placeholder="Présentez brièvement l'auteur..."
        rows="6"
      ></textarea>

    </div>

  </div>

  <div class="form-actions">

    <button
      type="button"
      class="cancel-button"
      routerLink="/authors"
    >
      Annuler
    </button>


    <button
      type="submit"
      class="submit-button"
    >

      <span class="material-symbols-outlined">
        save
      </span>

      Enregistrer

    </button>

  </div>

</form>


  </div>

</div>
